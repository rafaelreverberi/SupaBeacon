name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${GITHUB_REF_NAME#v}
          test "$(node -p 'require("./package.json").version')" = "$version"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
          printf 'version=%s\nimage=ghcr.io/%s\n' "$version" "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
  verify:
    uses: ./.github/workflows/ci.yml
  images:
    needs: [metadata, verify]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      IMAGE: ${{ needs.metadata.outputs.image }}:${{ needs.metadata.outputs.version }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Verify the published architecture image
        shell: bash
        run: |
          docker pull "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = '${{ matrix.arch }}'
          docker run -d --name release-smoke --read-only --tmpfs /tmp:size=16m --tmpfs /app/data:uid=1000,gid=1000,mode=0700 \
            -e ENCRYPTION_KEY="$(openssl rand -hex 32)" -e SETUP_TOKEN="$(openssl rand -hex 32)" -e APP_URL=http://localhost:8080 "$IMAGE"
          for attempt in {1..30}; do
            if docker exec release-smoke node -e "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then exit 0; fi
            sleep 2
          done
          exit 1
      - if: always()
        run: docker rm -f release-smoke || true
  publish:
    needs: [metadata, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ${{ needs.metadata.outputs.image }}
      VERSION: ${{ needs.metadata.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tags
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
      - name: Package installer, source and checksums
        run: |
          mkdir release-assets
          git archive --format=tar.gz --prefix="SupaBeacon-$VERSION/" --output="release-assets/SupaBeacon-v$VERSION.tar.gz" HEAD
          cp compose.yaml release-assets/
          cp apps/web/public/branding/SupaBeacon_Logo.png release-assets/
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > release-assets/image-manifest.json
          cd release-assets
          sha256sum *.tar.gz compose.yaml SupaBeacon_Logo.png image-manifest.json > SHA256SUMS
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "SupaBeacon $VERSION" --notes-file "docs/releases/$GITHUB_REF_NAME.md" --latest
