name: supabeacon
services:
  supabeacon:
    build: .
    image: supabeacon:local
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /app/data/supabeacon.db
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8080}:8080'
    volumes:
      - data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 384m
    cpus: 1.0
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
volumes:
  data:
